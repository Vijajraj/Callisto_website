<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Background Space Gradient -->
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="60%" stop-color="#02040a" />
      <stop offset="100%" stop-color="#000205" />
    </radialGradient>

    <!-- Jovian Planet Sphere 3D Shading -->
    <radialGradient id="jovianSphere" cx="42%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#f5e6d0" />
      <stop offset="35%" stop-color="#d49b6a" />
      <stop offset="65%" stop-color="#9a5229" />
      <stop offset="85%" stop-color="#4a2211" />
      <stop offset="100%" stop-color="#140602" />
    </radialGradient>

    <!-- Great Red Spot Gradient -->
    <radialGradient id="grsGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5233" />
      <stop offset="45%" stop-color="#cf2e17" />
      <stop offset="80%" stop-color="#8a1809" />
      <stop offset="100%" stop-color="#540a02" />
    </radialGradient>

    <!-- Ammonia Storm Filaments -->
    <linearGradient id="cloudBand1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ebd5b9" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#c98a58" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#ebd5b9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#9b5832" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="cloudBand2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a3619" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#b86b3e" stop-opacity="0.75" />
      <stop offset="80%" stop-color="#4d1b09" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7a3619" stop-opacity="0.8" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <clipPath id="planetClip">
      <circle cx="580" cy="400" r="320" />
    </clipPath>
  </defs>

  <!-- Deep Cosmos Background -->
  <rect width="1200" height="800" fill="url(#spaceBg)" />

  <!-- Background Distant Stars -->
  <g fill="#ffffff" opacity="0.65">
    <circle cx="95" cy="84" r="1.2" />
    <circle cx="180" cy="220" r="0.8" />
    <circle cx="310" cy="90" r="1.5" />
    <circle cx="1040" cy="120" r="1.8" />
    <circle cx="1120" cy="280" r="0.9" />
    <circle cx="990" cy="650" r="1.4" />
    <circle cx="140" cy="680" r="1.1" />
    <circle cx="80" cy="450" r="0.7" />
    <circle cx="1090" cy="490" r="1.3" />
    <circle cx="780" cy="80" r="1.6" />
    <circle cx="450" cy="60" r="1.0" />
    <circle cx="1150" cy="710" r="1.5" />
    <circle cx="50" cy="300" r="1.2" />
    <circle cx="230" cy="740" r="0.8" />
  </g>

  <!-- Outer Jovian Atmospheric Haze -->
  <circle cx="580" cy="400" r="328" fill="#58a6ff" opacity="0.08" filter="url(#softGlow)" />
  <circle cx="580" cy="400" r="324" fill="#ffaa44" opacity="0.12" filter="url(#softGlow)" />

  <!-- Jupiter Planet Body -->
  <g clip-path="url(#planetClip)">
    <!-- Base Shading -->
    <circle cx="580" cy="400" r="320" fill="url(#jovianSphere)" />

    <!-- Atmospheric Swirling Belts & Zones -->
    <!-- North Polar Hood -->
    <path d="M 260 220 Q 580 250 900 220 L 900 80 Q 580 80 260 80 Z" fill="#69432e" opacity="0.6" />
    
    <!-- North North Temperate Zone -->
    <path d="M 260 240 Q 580 270 900 240 L 900 280 Q 580 310 260 280 Z" fill="url(#cloudBand1)" />
    
    <!-- North Temperate Belt -->
    <path d="M 260 285 Q 580 315 900 285 L 900 325 Q 580 355 260 325 Z" fill="url(#cloudBand2)" />
    
    <!-- North Equatorial Belt -->
    <path d="M 260 335 Q 580 365 900 335 L 900 380 Q 580 410 260 380 Z" fill="#753018" opacity="0.85" />
    
    <!-- Equatorial Zone (Bright Ammonia Plumes) -->
    <path d="M 260 385 Q 580 415 900 385 L 900 425 Q 580 455 260 425 Z" fill="url(#cloudBand1)" opacity="0.9" />
    
    <!-- South Equatorial Belt (Home of GRS) -->
    <path d="M 260 435 Q 580 465 900 435 L 900 495 Q 580 525 260 495 Z" fill="url(#cloudBand2)" opacity="0.95" />
    
    <!-- South Temperate Belt -->
    <path d="M 260 505 Q 580 535 900 505 L 900 550 Q 580 575 260 550 Z" fill="url(#cloudBand1)" opacity="0.75" />
    
    <!-- South Polar Region -->
    <path d="M 260 560 Q 580 590 900 560 L 900 720 Q 580 720 260 720 Z" fill="#4d2b1b" opacity="0.85" />

    <!-- Turbulent Vortices & Cyclonic Eddies -->
    <ellipse cx="440" cy="350" rx="45" ry="12" fill="#cfa57c" opacity="0.7" transform="rotate(-4 440 350)" />
    <ellipse cx="730" cy="360" rx="60" ry="14" fill="#a45229" opacity="0.6" transform="rotate(3 730 360)" />
    <ellipse cx="380" cy="510" rx="35" ry="9" fill="#f0dbbe" opacity="0.8" transform="rotate(-5 380 510)" />
    <ellipse cx="800" cy="530" rx="42" ry="10" fill="#f0dbbe" opacity="0.8" transform="rotate(4 800 530)" />

    <!-- THE GREAT RED SPOT -->
    <!-- Storm Hollow Deflection -->
    <ellipse cx="590" cy="465" rx="76" ry="46" fill="#692211" opacity="0.9" transform="rotate(-3 590 465)" />
    <!-- Outer Swirling Rim -->
    <ellipse cx="590" cy="465" rx="68" ry="40" fill="url(#grsGrad)" transform="rotate(-3 590 465)" />
    <!-- Inner High-Velocity Eye Core -->
    <ellipse cx="590" cy="465" rx="48" ry="26" fill="#ff6b4a" opacity="0.95" transform="rotate(-3 590 465)" />
    <ellipse cx="594" cy="465" rx="28" ry="14" fill="#ffa085" opacity="0.85" transform="rotate(-3 594 465)" />

    <!-- 3D Limb Darkening Shadow -->
    <path d="M 580 80 A 320 320 0 0 1 890 460 Q 750 490 620 400 Q 540 280 580 80 Z" fill="#000000" opacity="0.45" />
    <path d="M 720 160 A 320 320 0 0 1 900 400 A 320 320 0 0 1 680 710 Q 820 540 820 400 Q 820 270 720 160 Z" fill="#000000" opacity="0.7" />
  </g>

  <!-- Moon Callisto in Distant Orbit -->
  <g transform="translate(180, 240)">
    <circle cx="0" cy="0" r="16" fill="#1b2434" stroke="#485b78" stroke-width="1.5" />
    <circle cx="-3" cy="-3" r="14" fill="#3a4860" opacity="0.8" />
    <!-- Crater Impressions -->
    <circle cx="-5" cy="-2" r="3" fill="#202a3a" />
    <circle cx="2" cy="4" r="2.5" fill="#202a3a" />
    <circle cx="-1" cy="7" r="1.8" fill="#202a3a" />
    <text x="24" y="4" font-family="'Courier New', monospace" font-size="11" fill="#7ee787" letter-spacing="1">CALLISTO (J IV)</text>
  </g>

  <!-- Telemetry HUD & Scientific Watermark -->
  <g font-family="'Courier New', monospace" font-size="11" fill="#58a6ff" letter-spacing="1.5">
    <text x="40" y="50">MISSION: NASA JUNO ORBITER // PERIJOVE 62</text>
    <text x="40" y="70">TARGET: JUPITER // GREAT RED SPOT [22.0°S, 130.0°W]</text>
    <text x="40" y="760">INSTRUMENT: JUNOCAM MULTISPECTRAL // SPECTROMETRIC COMPOSITE</text>
    <text x="920" y="760">STATION: CIT DEEP SKY ARRAY</text>
  </g>
</svg>
