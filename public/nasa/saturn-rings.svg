<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceDark" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#050a16" />
      <stop offset="60%" stop-color="#02030a" />
      <stop offset="100%" stop-color="#000104" />
    </radialGradient>
    <radialGradient id="saturnBody" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4a3828" />
      <stop offset="40%" stop-color="#2a1f16" />
      <stop offset="80%" stop-color="#140d08" />
      <stop offset="100%" stop-color="#050302" />
    </radialGradient>
    <linearGradient id="ringLuminance" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.1" />
      <stop offset="25%" stop-color="#fef08a" stop-opacity="0.95" />
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="53%" stop-color="#050814" stop-opacity="0.8" /> <!-- Cassini Division -->
      <stop offset="60%" stop-color="#fde047" stop-opacity="0.95" />
      <stop offset="90%" stop-color="#f59e0b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05" />
    </linearGradient>
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#spaceDark)" />

  <!-- Background Field Stars -->
  <g fill="#ffffff" opacity="0.65">
    <circle cx="110" cy="120" r="1.2" />
    <circle cx="240" cy="280" r="0.9" />
    <circle cx="950" cy="90" r="1.5" />
    <circle cx="1090" cy="240" r="1.0" />
    <circle cx="1020" cy="680" r="1.4" />
    <circle cx="150" cy="650" r="1.1" />
  </g>

  <!-- Saturn System Center -->
  <g transform="translate(600, 420) rotate(-14)">
    <!-- Back Ring Half (behind planet) -->
    <ellipse cx="0" cy="0" rx="460" ry="85" fill="none" stroke="url(#ringLuminance)" stroke-width="48" filter="url(#ringGlow)" />
    
    <!-- Planet Disc (Methane dark absorption in near-infrared) -->
    <circle cx="0" cy="0" r="170" fill="url(#saturnBody)" />
    
    <!-- Atmospheric subtle polar haze -->
    <ellipse cx="0" cy="-140" rx="90" ry="25" fill="#fef08a" opacity="0.15" />
    <ellipse cx="0" cy="140" rx="80" ry="22" fill="#fef08a" opacity="0.08" />

    <!-- Planet Shadow Cast on Rings -->
    <path d="M 40 -120 Q 90 -40 85 40 L 140 20 Q 140 -60 100 -120 Z" fill="#000000" opacity="0.9" />

    <!-- Front Ring Half (in front of planet) -->
    <!-- Clip front half -->
    <g clip-path="url(#frontRingClip)">
      <ellipse cx="0" cy="0" rx="460" ry="85" fill="none" stroke="url(#ringLuminance)" stroke-width="48" filter="url(#ringGlow)" />
    </g>

    <!-- Ring Shadow on Planet Equator -->
    <path d="M -160 0 Q 0 45 160 0 Q 0 25 -160 0 Z" fill="#000000" opacity="0.85" />
  </g>

  <!-- Moon Titan in Orbit -->
  <g transform="translate(260, 220)">
    <circle cx="0" cy="0" r="14" fill="#f59e0b" filter="url(#ringGlow)" />
    <circle cx="0" cy="0" r="12" fill="#d97706" />
    <circle cx="-3" cy="-3" r="10" fill="#fef3c7" opacity="0.5" />
    <text x="22" y="4" font-family="'Courier New', monospace" font-size="11" fill="#fde047" letter-spacing="1">TITAN (S VI)</text>
  </g>

  <!-- Telemetry HUD -->
  <g font-family="'Courier New', monospace" font-size="11" fill="#fde047" letter-spacing="1.5">
    <text x="40" y="50">MISSION: JAMES WEBB SPACE TELESCOPE (JWST) // NIRCam F323N</text>
    <text x="40" y="70">TARGET: SATURN RING SYSTEM & TITAN // 3.23 MICRON METHANE ABSORPTION</text>
    <text x="40" y="760">DISTANCE: 1.43 BILLION KM (9.58 AU) // ICE PARTICLES 99% WATER ICE</text>
    <text x="910" y="760">CIT DEEP SKY #JWST-SATURN</text>
  </g>
</svg>
