<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Background Cavity Gradient -->
    <radialGradient id="skyCavity" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#04122e" />
      <stop offset="40%" stop-color="#06183b" />
      <stop offset="70%" stop-color="#020817" />
      <stop offset="100%" stop-color="#00030a" />
    </radialGradient>

    <!-- Mountain Cliff Ridge Gradient -->
    <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e07a34" />
      <stop offset="25%" stop-color="#ad4617" />
      <stop offset="60%" stop-color="#5e210b" />
      <stop offset="100%" stop-color="#1c0702" />
    </linearGradient>

    <!-- Glowing Ionized Edge -->
    <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb066" />
      <stop offset="50%" stop-color="#ffdfa9" />
      <stop offset="100%" stop-color="#79c0ff" />
    </linearGradient>

    <radialGradient id="starBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#7ee787" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#58a6ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="softMist" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
    </filter>
  </defs>

  <!-- Deep Infrared Sky Cavity -->
  <rect width="1200" height="800" fill="url(#skyCavity)" />

  <!-- Diffuse Hot Ionized Gas in Upper Cavity -->
  <ellipse cx="600" cy="180" rx="500" ry="140" fill="#1f427a" opacity="0.25" filter="url(#softMist)" />
  <ellipse cx="400" cy="120" rx="250" ry="90" fill="#388bfd" opacity="0.15" filter="url(#softMist)" />

  <!-- Dense Distant Star Field -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="80" cy="100" r="1.3" />
    <circle cx="160" cy="220" r="0.9" />
    <circle cx="270" cy="80" r="1.5" />
    <circle cx="480" cy="160" r="1.2" />
    <circle cx="680" cy="90" r="1.7" />
    <circle cx="820" cy="210" r="1.0" />
    <circle cx="940" cy="70" r="1.8" />
    <circle cx="1100" cy="140" r="1.4" />
    <circle cx="1140" cy="280" r="1.1" />
  </g>

  <!-- Bright Massive Stars in Cavity with Diffraction Spikes -->
  <g transform="translate(720, 150)">
    <circle cx="0" cy="0" r="35" fill="url(#starBurst)" />
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#ffffff" stroke-width="1.8" />
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#ffffff" stroke-width="1.8" />
    <line x1="-50" y1="-50" x2="50" y2="50" stroke="#7ee787" stroke-width="1.2" />
    <line x1="-50" y1="50" x2="50" y2="-50" stroke="#7ee787" stroke-width="1.2" />
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" />
  </g>

  <g transform="translate(240, 180)">
    <circle cx="0" cy="0" r="28" fill="url(#starBurst)" />
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#ffffff" stroke-width="1.4" />
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#ffffff" stroke-width="1.4" />
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
  </g>

  <!-- COSMIC CLIFFS: MOUNTAINOUS NEBULAR RIDGES -->
  <!-- Back Layer Cliffs -->
  <path d="M 0 460 Q 180 380 340 430 T 700 370 T 980 410 T 1200 340 L 1200 800 L 0 800 Z" fill="#4d1b09" opacity="0.6" />
  
  <!-- Main High-Contrast Mountain Ridge -->
  <path d="M 0 540 Q 120 440 240 480 T 520 400 T 780 470 T 1020 380 Q 1120 420 1200 390 L 1200 800 L 0 800 Z" fill="url(#cliffGrad)" />

  <!-- Luminous Edge of Photoevaporation (UV Radiation from Massive Cluster) -->
  <path d="M 0 540 Q 120 440 240 480 T 520 400 T 780 470 T 1020 380 Q 1120 420 1200 390" fill="none" stroke="url(#edgeGlow)" stroke-width="5" opacity="0.9" filter="url(#softMist)" />
  <path d="M 0 540 Q 120 440 240 480 T 520 400 T 780 470 T 1020 380 Q 1120 420 1200 390" fill="none" stroke="#fff" stroke-width="1.8" opacity="0.95" />

  <!-- Foreground Dust Wisps & Protostellar Outflow Jets -->
  <ellipse cx="360" cy="560" rx="60" ry="22" fill="#ff7b72" opacity="0.25" filter="url(#softMist)" />
  <ellipse cx="680" cy="610" rx="90" ry="30" fill="#ffa657" opacity="0.2" filter="url(#softMist)" />
  <ellipse cx="940" cy="520" rx="70" ry="25" fill="#d2a8ff" opacity="0.2" filter="url(#softMist)" />

  <!-- Emerging Protostars inside the Dense Dust Wall -->
  <circle cx="360" cy="560" r="3.5" fill="#fff" />
  <circle cx="680" cy="610" r="4" fill="#fff" />
  <circle cx="940" cy="520" r="3" fill="#fff" />

  <!-- Scientific Metadata HUD -->
  <g font-family="'Courier New', monospace" font-size="11" fill="#ffa657" letter-spacing="1.5">
    <text x="40" y="50">MISSION: JWST DEEP SURVEY // NIRCam EMISSION MOSAIC</text>
    <text x="40" y="70">TARGET: CARINA NEBULA COSMIC CLIFFS (NGC 3324) // STELLAR NURSERY</text>
    <text x="40" y="760">COORDINATES: RA 10h 37m | DEC -58° 38' // DISTANCE: 7,600 LIGHT-YEARS</text>
    <text x="890" y="760">ARCHIVE REF: CIT-JWST-NGC3324</text>
  </g>
</svg>
