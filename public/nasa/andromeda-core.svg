<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Deep Cosmic Void -->
    <radialGradient id="voidSpace" cx="50%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#050a17" />
      <stop offset="60%" stop-color="#02040a" />
      <stop offset="100%" stop-color="#000103" />
    </radialGradient>

    <!-- Galactic Core Bulge (Old Golden Stars) -->
    <radialGradient id="coreBulge" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fff2cc" />
      <stop offset="55%" stop-color="#ffb86c" />
      <stop offset="85%" stop-color="#bd5319" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#140602" stop-opacity="0" />
    </radialGradient>

    <!-- Spiral Arm Disk Gradient (Young Blue Stars & Ionization) -->
    <radialGradient id="spiralDisk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#79c0ff" stop-opacity="0.45" />
      <stop offset="75%" stop-color="#388bfd" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0a1226" stop-opacity="0" />
    </radialGradient>

    <filter id="spiralGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
    </filter>
  </defs>

  <!-- Deep Cosmos Background -->
  <rect width="1200" height="800" fill="url(#voidSpace)" />

  <!-- Background Field Stars -->
  <g fill="#ffffff" opacity="0.75">
    <circle cx="90" cy="120" r="1.3" />
    <circle cx="150" cy="340" r="0.9" />
    <circle cx="280" cy="110" r="1.6" />
    <circle cx="390" cy="680" r="1.1" />
    <circle cx="950" cy="110" r="1.8" />
    <circle cx="1060" cy="240" r="1.4" />
    <circle cx="1120" cy="620" r="1.2" />
    <circle cx="850" cy="710" r="1.5" />
  </g>

  <!-- ANDROMEDA GALAXY (MESSIER 31) MAIN INCLINED DISK -->
  <g transform="translate(600, 400) rotate(-32)">
    <!-- Broad Diffuse Disk Halo -->
    <ellipse cx="0" cy="0" rx="480" ry="160" fill="url(#spiralDisk)" filter="url(#spiralGlow)" />
    <ellipse cx="0" cy="0" rx="420" ry="135" fill="url(#spiralDisk)" />

    <!-- Spiral Arm Dust Lanes (Interstellar Extinction Silhouettes) -->
    <ellipse cx="-15" cy="-25" rx="360" ry="105" fill="none" stroke="#040712" stroke-width="24" opacity="0.75" />
    <ellipse cx="15" cy="25" rx="340" ry="98" fill="none" stroke="#040712" stroke-width="20" opacity="0.7" />
    <ellipse cx="-20" cy="-15" rx="260" ry="75" fill="none" stroke="#080c1a" stroke-width="16" opacity="0.8" />
    <ellipse cx="20" cy="15" rx="240" ry="68" fill="none" stroke="#080c1a" stroke-width="14" opacity="0.75" />

    <!-- Blue Star-Forming OB Associations in Outer Arms -->
    <circle cx="-320" cy="-60" r="8" fill="#79c0ff" opacity="0.7" filter="url(#spiralGlow)" />
    <circle cx="310" cy="55" r="9" fill="#79c0ff" opacity="0.7" filter="url(#spiralGlow)" />
    <circle cx="-220" cy="-45" r="6" fill="#79c0ff" opacity="0.6" />
    <circle cx="210" cy="40" r="7" fill="#79c0ff" opacity="0.6" />

    <!-- High-Luminosity Core Bulge -->
    <ellipse cx="0" cy="0" rx="150" ry="75" fill="url(#coreBulge)" />
    <ellipse cx="0" cy="0" rx="60" ry="32" fill="#ffffff" opacity="0.95" />
  </g>

  <!-- Satellite Galaxy M32 (Compact Elliptical) -->
  <g transform="translate(620, 220)">
    <circle cx="0" cy="0" r="30" fill="url(#coreBulge)" opacity="0.65" />
    <circle cx="0" cy="0" r="10" fill="#fff" opacity="0.9" />
    <text x="35" y="4" font-family="'Courier New', monospace" font-size="10" fill="#d2a8ff" letter-spacing="1">M32 (NGC 221)</text>
  </g>

  <!-- Satellite Galaxy M110 (Dwarf Spheroidal) -->
  <g transform="translate(540, 620) rotate(-20)">
    <ellipse cx="0" cy="0" rx="50" ry="24" fill="url(#coreBulge)" opacity="0.45" />
    <ellipse cx="0" cy="0" rx="16" ry="8" fill="#ffdfa9" opacity="0.7" />
    <text x="55" y="4" font-family="'Courier New', monospace" font-size="10" fill="#d2a8ff" letter-spacing="1">M110 (NGC 205)</text>
  </g>

  <!-- Astrophotographic Telemetry HUD -->
  <g font-family="'Courier New', monospace" font-size="11" fill="#79c0ff" letter-spacing="1.5">
    <text x="40" y="50">SURVEY: HUBBLE & SPITZER JOINT DEEP SKY RECONNAISSANCE</text>
    <text x="40" y="70">TARGET: ANDROMEDA GALAXY (M31 / NGC 224) // SPIRAL GALAXY CORE</text>
    <text x="40" y="760">DISTANCE: 2.537 MILLION LIGHT-YEARS // APPROACH VELOCITY: ~110 KM/S</text>
    <text x="890" y="760">CIT ARCHIVE: CIT-M31-DEEPCORE</text>
  </g>
</svg>
